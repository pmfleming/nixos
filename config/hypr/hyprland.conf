$terminal = ghostty
$browser = zen
$menu = rofi-app-menu

monitor = ,preferred,auto,1.25

# Let nwg-displays persist monitor/workspace layout outside the managed HM symlink.
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

@HYPRLAND_ENV@

# Start the systemd user graphical session once Hyprland has exported its
# Wayland environment. Home Manager services such as hypridle are bound to it.
exec-once = @DBUS_UPDATE_ACTIVATION_ENVIRONMENT@ --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
exec-once = @SYSTEMCTL@ --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
exec-once = @SYSTEMCTL@ --user start hyprland-session.target
exec-shutdown = @SYSTEMCTL@ --user stop hyprland-session.target

exec-once = sh -c "pgrep -u \"$USER\" -f '(^|/)waybar( |$)' >/dev/null || waybar >/dev/null 2>&1"
exec-once = hyprpaper
exec-once = @HYPRPOLKITAGENT@/libexec/hyprpolkitagent
exec-once = swayosd-server
exec-once = sh -c "nmcli device wifi rescan >/dev/null 2>&1 || true"
# Start Scratchpad silently on its dedicated fifth workspace. Waybar supplies
# the workspace's Scratchpad icon.
exec-once = @SCRATCHPAD@
# Waybar has native NetworkManager/Bluetooth controls; avoid duplicate tray icons.
# Clipboard history/persistence is managed by Home Manager systemd user services.

input {
  kb_layout = us,gb
  kb_variant = intl,
  follow_mouse = 1

  touchpad {
    natural_scroll = true
  }
}


general {
  gaps_in = 1
  gaps_out = 2
  border_size = 1
  col.active_border = rgba(@ACCENT_BARE@ee)
  col.inactive_border = rgba(@BORDER_DIM_BARE@aa)
  layout = dwindle
}

decoration {
  rounding = @RADIUS_INT@
  active_opacity = 1.0
  inactive_opacity = 0.96

  blur {
    enabled = true
    size = 2
    passes = 1
    vibrancy = 0.12
  }
}

animations {
  enabled = true

  bezier = easeOut, 0.16, 1, 0.3, 1

  animation = windows, 1, 2, easeOut
  animation = border, 1, 2, easeOut
  animation = fade, 1, 2, easeOut
  animation = workspaces, 1, 2, easeOut
}

dwindle {
  preserve_split = true
  smart_split = true
  smart_resizing = true
  force_split = 0
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  force_default_wallpaper = 0
}

render {
  cm_enabled = false
  cm_auto_hdr = 0
}

workspace = 1, default:true
workspace = 2
workspace = 3
workspace = 4
workspace = 5

# Regular Ghostty windows belong on workspace 1. Yazi uses its own Ghostty
# application class, so its file-manager window remains on the active workspace.
windowrule = workspace 1 silent, match:class ^(com.mitchellh.ghostty|ghostty)$
windowrule = workspace 2 silent, match:class ^(zen|zen-browser|Zen|google-chrome|Google-chrome)$
windowrule = float on, match:class ^(shelllist-captive-portal)$
windowrule = float on, match:class ^(com\.gabm\.satty)$
windowrule = center on, match:class ^(com\.gabm\.satty)$
windowrule = workspace 3 silent, match:class ^(Code|code|VSCodium|codium|jetbrains-studio)$
windowrule = workspace 4 silent, match:class ^(Spotify)$
windowrule = workspace 5 silent, match:class ^(scratchpad)$

bind = SUPER, RETURN, exec, $terminal
bind = SUPER, SPACE, exec, $menu
bind = SUPER, W, exec, $browser
bind = SUPER, B, exec, rofi-bluetooth-menu
bind = SUPER, E, exec, ghostty --class=com.laufan.yazi -e yazi
bind = SUPER, P, exec, nwg-displays
bind = SUPER, N, exec, ~/.local/bin/shelllist-wifi toggle
bind = SUPER, V, exec, rofi-clipboard-menu
bind = SUPER, L, exec, hyprlock
bind = SUPER, Q, killactive
bind = SUPER, F, togglefloating
bind = SUPER SHIFT, F, fullscreen
bind = SUPER SHIFT, S, exec, screenshot-annotate
bind = SUPER CTRL, S, exec, grim -g "$(slurp)" - | wl-copy --type image/png
bind = SUPER ALT, S, exec, grim - | wl-copy --type image/png
bind = SUPER SHIFT, Escape, exec, wlogout
bind = SUPER, K, exec, hyprctl switchxkblayout all next

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5

# Three-finger horizontal touchpad swipe switches workspaces.
gesture = 3, horizontal, workspace

bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d
bind = SUPER SHIFT, LEFT, movewindow, l
bind = SUPER SHIFT, RIGHT, movewindow, r
bind = SUPER SHIFT, UP, movewindow, u
bind = SUPER SHIFT, DOWN, movewindow, d
bind = SUPER CTRL, LEFT, resizeactive, -30 0
bind = SUPER CTRL, RIGHT, resizeactive, 30 0
bind = SUPER CTRL, UP, resizeactive, 0 -30
bind = SUPER CTRL, DOWN, resizeactive, 0 30

bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume +5
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume -5
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness +5
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness -5
