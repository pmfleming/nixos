# Generated by Home Manager from /etc/nixos/theme.nix.
# Scratchpad reads this when editor.appearance_source = "system".

[font]
family = "@FONT_CODE@"
size = @FONT_SIZE@

[palette]
color_scheme = "dark"
background = "@BG@"
text = "@TEXT@"
subtext = "@SUBTEXT@"
accent = "@ACCENT@"
highlight = "@ACCENT@"
highlight_text = "@WHITE@"
selected_background = "#@SELECTED_BG_BARE@"
border = "@BORDER_DIM@"
success = "@SUCCESS@"
danger = "@DANGER@"
warning = "@WARNING@"
